# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "master"
    schedule:
      # Monthly and grouped into a single PR: the previous daily cadence produced a steady trickle of one-bump
      # branches (six were open at once), each costing a full IDE-downloading CI run, and nobody reads them that often.
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: [ "*" ]
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: [ "*" ]
